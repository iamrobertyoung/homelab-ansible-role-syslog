name: Molecule

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  molecule:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The host's AppArmor profile for /usr/sbin/rsyslogd also attaches to the
      # container's rsyslogd and denies it the private key, failing `rsyslogd -N1`.
      - name: Unload the host rsyslogd AppArmor profile
        run: |
          if [ -f /etc/apparmor.d/usr.sbin.rsyslogd ]; then
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.rsyslogd
          fi

      - name: Run molecule test
        run: molecule test
