name: Molecule

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  molecule:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The host's AppArmor profile for /usr/sbin/rsyslogd also attaches to the
      # container's rsyslogd and denies it the private key, failing `rsyslogd -N1`.
      - name: Unload the host rsyslogd AppArmor profile
        run: |
          if [ -f /etc/apparmor.d/usr.sbin.rsyslogd ]; then
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.rsyslogd
          fi

      - name: Run molecule test
        run: molecule test
