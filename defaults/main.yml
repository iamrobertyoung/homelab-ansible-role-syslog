---
# Where logs are forwarded. A list, because a host forwards to two places
# while a destination is being replaced. Each entry takes `host`, `port`, and
# optionally `framing`.
#
# The default is the in-cluster Loki receiver, and it used to be Graylog
# (iamrobertyoung/homelab-platform#178). A repo migrates by bumping this role's
# version and nothing else: the bump *is* the cutover, which is why it is a
# major release rather than something that could arrive unnoticed.
#
# `framing` is omitted by default, leaving rsyslog's own default of
# non-transparent, newline-delimited framing. RFC 6587 recommends
# octet-counted, and without it a receiver must wait for the *next* message to
# know the current one ended, so a quiet host's last line sits in limbo. The
# Loki receiver is configured for it.
syslog_destinations:
  - host: syslog.k8s.local.iamrobertyoung.co.uk
    port: 6514
    framing: octet-counted

# syslog_fqdn: Required - Fully qualified domain name of the host (used for TLS certificate paths)
